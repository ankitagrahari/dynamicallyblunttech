baseURL = "https://dynamicallyblunttech.com/"
locale = 'en-us'
title = 'Backend Brilliance'
theme = 'congo'
enableRobotsTXT = true

[services]
  [services.googleAnalytics]
    id = "G-DBHXRZP2DM"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

[params]
  defaultTheme = "dark"          # Activates Congo's sleek tech dark-mode layout
  showReadingTime = true         # Surfaces reading statistics per post
  enableSearch = true

[params.homepage]
    showRecent = true
    recentLimit = 10
    showSummary = true

[[menu.main]]
  name = "All Posts"
  pageRef = "posts"
  weight = 10

[article]
  showBreadcrumbs = true
  showPagination = true

[taxonomies]
  categories = "categories"
  tags = "tags"
  series = "series"