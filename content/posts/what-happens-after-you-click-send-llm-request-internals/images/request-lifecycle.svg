<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
 <title id="title">LLM request lifecycle</title><desc id="desc">A request goes from browser to application, model API, serving system and model; the response streams back through the same layers.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0f766e"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4f46e5"/></marker></defs>
 <rect width="1200" height="560" rx="22" fill="#f7fafc"/>
 <text x="55" y="62" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#12263a">One chat message, several system boundaries</text>
 <text x="55" y="94" font-family="Arial,sans-serif" font-size="16" fill="#526579">The API/provider internals vary; this is the common application-level path.</text>
 <g font-family="Arial,sans-serif" text-anchor="middle">
  <rect x="45" y="180" width="190" height="130" rx="16" fill="#e5f4f1" stroke="#6caea5"/><text x="140" y="225" font-size="20" font-weight="700" fill="#123b3a">Browser</text><text x="140" y="256" font-size="15" fill="#365d5a">chat + event stream</text>
  <rect x="285" y="180" width="190" height="130" rx="16" fill="#e8efff" stroke="#8098db"/><text x="380" y="225" font-size="20" font-weight="700" fill="#202f5f">App backend</text><text x="380" y="256" font-size="15" fill="#465987">auth + prompt context</text>
  <rect x="525" y="180" width="190" height="130" rx="16" fill="#f1ebff" stroke="#a68bda"/><text x="620" y="225" font-size="20" font-weight="700" fill="#402f68">Model API</text><text x="620" y="256" font-size="15" fill="#655487">validate + route</text>
  <rect x="765" y="180" width="190" height="130" rx="16" fill="#fff3df" stroke="#d6a956"/><text x="860" y="225" font-size="20" font-weight="700" fill="#604617">Serving layer</text><text x="860" y="256" font-size="15" fill="#806534">admit + schedule</text>
  <rect x="1005" y="180" width="150" height="130" rx="16" fill="#e4f4e8" stroke="#74b782"/><text x="1080" y="225" font-size="20" font-weight="700" fill="#205431">Model</text><text x="1080" y="256" font-size="15" fill="#477452">input → output</text>
 </g>
 <g fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"><path d="M238 210h40"/><path d="M478 210h40"/><path d="M718 210h40"/><path d="M958 210h40"/></g>
 <g fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#b)"><path d="M1000 282H962"/><path d="M760 282H722"/><path d="M520 282H482"/><path d="M280 282H242"/></g>
 <g font-family="Arial,sans-serif" font-size="15"><text x="600" y="152" text-anchor="middle" fill="#0f766e" font-weight="700">REQUEST · messages, options, tools, context</text><text x="600" y="353" text-anchor="middle" fill="#4f46e5" font-weight="700">RESPONSE · stream chunks, completion or error</text></g>
 <rect x="250" y="408" width="700" height="92" rx="15" fill="#fff" stroke="#d9e2ec"/>
 <text x="600" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#263b50">Optional application loop</text>
 <text x="600" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Model requests a tool → backend authorizes and runs it → result returns to the model</text>
</svg>
