<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
 <title id="title">Time to first token and streamed generation</title><desc id="desc">A horizontal timeline shows request start, a wait before the first token, several output chunks, and completion.</desc>
 <rect width="1100" height="410" rx="22" fill="#f7fafc"/>
 <text x="55" y="62" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12263a">A streamed response has a start delay and a generation period</text>
 <text x="55" y="95" font-family="Arial,sans-serif" font-size="16" fill="#526579">The user sees output before the full response is finished.</text>
 <line x1="100" y1="205" x2="1000" y2="205" stroke="#9aaabd" stroke-width="5"/>
 <g fill="#fff" stroke="#64748b" stroke-width="3"><circle cx="120" cy="205" r="12"/><circle cx="420" cy="205" r="12"/><circle cx="570" cy="205" r="12"/><circle cx="710" cy="205" r="12"/><circle cx="850" cy="205" r="12"/><circle cx="980" cy="205" r="12"/></g>
 <line x1="135" y1="205" x2="405" y2="205" stroke="#d99b32" stroke-width="8"/><line x1="435" y1="205" x2="965" y2="205" stroke="#16867d" stroke-width="8"/>
 <g font-family="Arial,sans-serif" text-anchor="middle"><text x="120" y="160" font-size="16" font-weight="700" fill="#263b50">Request sent</text><text x="420" y="145" font-size="16" font-weight="700" fill="#263b50">First chunk</text><text x="570" y="160" font-size="14" fill="#263b50">chunk 2</text><text x="710" y="145" font-size="14" fill="#263b50">chunk 3</text><text x="850" y="160" font-size="14" fill="#263b50">chunk 4</text><text x="980" y="145" font-size="16" font-weight="700" fill="#263b50">Complete</text>
 <text x="270" y="250" font-size="16" font-weight="700" fill="#9b6913">Time to first token (TTFT)</text><text x="700" y="250" font-size="16" font-weight="700" fill="#116c65">Streaming generation</text></g>
 <path d="M120 288v18h300v-18" fill="none" stroke="#d99b32" stroke-width="2"/><path d="M420 288v18h560v-18" fill="none" stroke="#16867d" stroke-width="2"/>
 <text x="550" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Network, queueing, input size, runtime, and buffering can affect different parts of this timeline.</text>
</svg>
