<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">What happens after you click send?</title>
  <desc id="desc">A schematic path from a chat window through an application and serving layer to an AI model and back as a stream.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a30"/><stop offset="1" stop-color="#172c42"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#68e0cf"/><stop offset="1" stop-color="#72a7ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#68e0cf"/></marker>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="170" fill="#68e0cf" opacity=".06"/><circle cx="90" cy="570" r="210" fill="#72a7ff" opacity=".07"/>
  <text x="86" y="116" fill="#68e0cf" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">AI SYSTEMS, EXPLAINED</text>
  <text x="86" y="190" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="52" font-weight="700">What happens after</text>
  <text x="86" y="250" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="52" font-weight="700">you click <tspan fill="#68e0cf">Send?</tspan></text>
  <text x="88" y="296" fill="#b4c3d3" font-family="Arial,sans-serif" font-size="24">Inside the lifecycle of an LLM request</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="90" y="390" width="210" height="112" rx="18" fill="#20344a" stroke="#42617a"/><text x="195" y="438" fill="#f4f7fb" font-size="20" font-weight="700">CHAT UI</text><text x="195" y="470" fill="#aebfd0" font-size="16">message + stream</text>
    <rect x="365" y="390" width="210" height="112" rx="18" fill="#20344a" stroke="#42617a"/><text x="470" y="438" fill="#f4f7fb" font-size="20" font-weight="700">APPLICATION</text><text x="470" y="470" fill="#aebfd0" font-size="16">auth + context</text>
    <rect x="640" y="390" width="210" height="112" rx="18" fill="#20344a" stroke="#42617a"/><text x="745" y="438" fill="#f4f7fb" font-size="20" font-weight="700">SERVING</text><text x="745" y="470" fill="#aebfd0" font-size="16">routing + queue</text>
    <rect x="915" y="390" width="210" height="112" rx="18" fill="#20344a" stroke="#42617a"/><text x="1020" y="438" fill="#f4f7fb" font-size="20" font-weight="700">MODEL</text><text x="1020" y="470" fill="#aebfd0" font-size="16">tokens → tokens</text>
  </g>
  <path d="M303 446h52M578 446h52M853 446h52" fill="none" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1020 522 C900 586 300 586 195 522" fill="none" stroke="#72a7ff" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)" opacity=".85"/>
  <text x="600" y="579" fill="#9fb2c7" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Response chunks travel back to the interface as they arrive</text>
</svg>
