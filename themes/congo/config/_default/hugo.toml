# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://dynamicallyblunttech.com/"
locale = 'en-us'
title = 'Backend Brilliance'
theme = 'congo'
enableRobotsTXT = true
defaultContentLanguage = "en"
summaryLength = 30

[services]
  [services.googleAnalytics]
    id = "G-DBHXRZP2DM"
  [services.rss]
    limit = 7
  [services.x]
    disableInlineCSS = true

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "blog-feed"

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"