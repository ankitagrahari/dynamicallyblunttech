name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main # Triggers deployment whenever you push to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0 # Standard stable version
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Crucial for pulling in the Congo theme folder
          fetch-depth: 0

      - name: Setup Pages Architecture
        id: pages
        uses: actions/configure-pages@v4

      - name: Install Hugo CLI
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true # Required for processing complex theme SCSS/CSS layers

      - name: Build Static Site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: "https://ankitagrahari.github.io/dynamicallyblunttech/"
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://ankitagrahari.github.io/dynamicallyblunttech/"

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Live to GitHub Edge Nodes
        id: deployment
        uses: actions/deploy-pages@v4
